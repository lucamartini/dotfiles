##### General Settings #####
set-option -g default-shell /bin/zsh
set-option -g default-terminal "tmux-256color"
#set-option -g default-terminal "$TERM"
set-option -ga terminal-overrides ",*256col*:Tc"
set-option -g xterm-keys on
set-option -g bell-action none
set-option -g set-clipboard on
set-option -sg escape-time 10
set-option -g detach-on-destroy off
set-option -g mouse on
set-option -g history-limit 50000
set-option -g display-time 1000
set-option -g focus-events on
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g allow-passthrough on
set-option -ga update-environment TERM
set-option -ga update-environment TERM_PROGRAM
##### fix curl and underscore colors #####
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

##### Prefix Key #####
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

##### Mouse + Copy Mode Enhancements #####
unbind -T copy-mode-vi MouseDragEnd1Pane
# unbind -T root MouseDrag1Pane
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe

##### Window & Pane Management #####
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c '#{pane_current_path}'
bind S choose-tree -Zs
bind b setw synchronize-panes
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind-key ` last-window

##### Copy-Mode Pane Navigation (Vim-style) #####
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

##### Status Line #####
set-option -g status-style "bg=terminal,fg=color10"
set-option -g status-position top
set-window-option -g window-status-format "#[bg=blue fg=black noreverse] #{window_index} #{window_name} "
set-window-option -g window-status-current-format "#{?window_zoomed_flag,#[bg=color9 fg=black noreverse],#[bg=color10 fg=black noreverse]} #{window_index} #{?window_zoomed_flag,ZOOMED ,}#{window_name} "

set-option -g status-left '#{tmux_mode_indicator} #{session_name} '
set-option -g status-right '#[fg=green]#H'

##### Pane border #####
set-option -g display-panes-active-colour green
set-option -g pane-border-status top
set-option -g pane-border-format "[#[fg=white]#{?pane_active,#[bold],}#P: #{pane_current_command}#[fg=default,nobold]]"
set-option -g pane-border-style fg=blue
set-option -g pane-active-border-style fg=green
set-option -g pane-border-lines heavy

##### Plugins: TPM + Extras #####
set -g @plugin 'tmux-plugins/tpm'

##### Smart Splits between tmux and neovim #####
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @smart-splits_move_left_key 'C-h'
set -g @smart-splits_move_down_key 'C-j'
set -g @smart-splits_move_up_key 'C-k'
set -g @smart-splits_move_right_key 'C-l'
set -g @smart-splits_resize_left_key 'M-h'
set -g @smart-splits_resize_down_key 'M-j'
set -g @smart-splits_resize_up_key 'M-k'
set -g @smart-splits_resize_right_key 'M-l'
set -g @smart-splits_resize_step_size '3'
set -g @smart-splits_at_edge 'stop'

##### Mode Indicator Plugin #####
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @mode_indicator_empty_prompt ' ◇ '
set -g @mode_indicator_empty_mode_style 'bg=term,fg=green'
set -g @mode_indicator_prefix_prompt ' ◈ '
set -g @mode_indicator_prefix_mode_style 'bg=green,fg=black'
set -g @mode_indicator_copy_prompt '  '
set -g @mode_indicator_copy_mode_style 'bg=yellow,fg=black'
set -g @mode_indicator_sync_prompt '   '
set -g @mode_indicator_sync_mode_style 'bg=red,fg=black'

##### Open links with F #####
# copy: [a-z]
# paste to CLI: shift-[a-z]
# open: ctrl-[a-z]
set -g @plugin 'Morantron/tmux-fingers'

##### Persistent Sessions #####
# Saved states are in ~/.local/share/tmux/resurrect/
set -g @plugin 'tmux-plugins/tmux-resurrect'
# In order to be executed periodically,
# the plugin updates the status-right tmux variable.
# In case some plugin (usually themes) overwrites the status-right variable,
# the autosave feature stops working.
# To fix this issue, place the plugin last in the TPM plugins list.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'


##### TPM Bootstrap #####
if-shell 'test ! -d ~/.tmux/plugins/tpm' \
  'run "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins"'

run -b '~/.tmux/plugins/tpm/tpm'
